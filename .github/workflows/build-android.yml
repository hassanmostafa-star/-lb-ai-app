name: Build LB AI Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android Platform Structure
        run: |
          flutter create --platforms=android --org=com.lbai.app .
          flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB for Google Play)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LB-AI-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: LB-AI-GooglePlay-AAB
          path: build/app/outputs/bundle/release/app-release.aab
