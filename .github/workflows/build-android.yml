name: Build LB AI Android App (Google Play Bundle & APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: flutter pub get

    # توليد ملف APK للتجربة على هاتفك
    - name: Build Android APK
      run: flutter build apk --release

    # توليد ملف AAB المخصص حصرياً لـ Google Play Console
    - name: Build Android App Bundle (AAB for Google Play)
      run: flutter build appbundle --release

    # رفع ملف الـ APK
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: LB-AI-App-APK
        path: build/app/outputs/flutter-apk/app-release.apk

    # رفع ملف الـ AAB الخاص بجوجل بلاي
    - name: Upload Google Play AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: LB-AI-GooglePlay-AAB
        path: build/app/outputs/bundle/release/app-release.aab
