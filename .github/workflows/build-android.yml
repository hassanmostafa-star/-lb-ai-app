name: Build LB AI Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Recreate Android Project Files
      run: flutter create . --platforms=android --org com.lbai.app

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Android App Bundle (For Google Play)
      run: flutter build appbundle --release

    - name: Build Android APK (For Phone Install)
      run: flutter build apk --release

    - name: Upload Google Play AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: LB-AI-GooglePlay-AAB
        path: build/app/outputs/bundle/release/app-release.aab

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: LB-AI-App-APK
        path: build/app/outputs/flutter-apk/app-release.apk
